name: ci
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install g++
        run: sudo apt-get update && sudo apt-get install -y g++ make
      - name: Build
        run: make
      - name: Test
        run: make test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tested MuJoCo bridge dependency
        run: python -m pip install mujoco==3.13.0
      - name: Bridge protocol and real physics regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v
