name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the version
        run: |
          v=$(sed -n 's/.*OS_VERSION = "\(.*\)";/\1/p' src/zron.cpp)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $v"; exit 1; }
      - name: Test
        run: make test && tools/sync-chalao.sh --check
      - name: Static binary + install tree
        run: |
          make clean && make static
          ./zron --version
          name=zronos-${GITHUB_REF_NAME}-linux-x86_64
          make install PREFIX=/tmp/$name
          cp README.md LICENSE CHANGELOG.md /tmp/$name/
          install -D -m 644 contrib/zronos@.service /tmp/$name/share/zronos/contrib/zronos@.service
          mkdir -p dist && tar -C /tmp -czf dist/$name.tar.gz $name
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[?"v {f=1; next} /^## / && f {exit} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/* --title "zronOS $GITHUB_REF_NAME" --notes "$notes"
