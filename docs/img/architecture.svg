<path d="M470.0 276 l0 12 m-5 -5 l5 5 l5 -5" stroke="#8b949e" stroke-width="1.4" fill="none"/>
<path d="M470.0 378 l0 12 m-5 -5 l5 5 l5 -5" stroke="#8b949e" stroke-width="1.4" fill="none"/>
