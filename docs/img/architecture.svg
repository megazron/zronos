<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<rect width="940" height="640" fill="#0d1117"/>
<text x="30" y="40" font-size="22" font-weight="700" fill="#e6edf3">zronOS architecture</text>
<text x="30" y="62" font-size="13" fill="#8b949e">A robot operating environment. Every service is a Robot Chalao (.rc) program.</text>
<rect x="30" y="84" width="880" height="86" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/>
<text x="48" y="110" font-size="15" font-weight="700" fill="#3fb950">Services (Robot Chalao .rc)</text>
<text x="48" y="128" font-size="11.5" fill="#8b949e">what the robot does -- one .rc per service, booted from the manifest</text>
<rect x="48" y="130" width="64" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="80" y="148" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">bringup</text>
<rect x="122.4" y="130" width="79" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="162" y="148" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">heartbeat</text>
<rect x="211.2" y="130" width="86" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="254" y="148" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">perception</text>
<rect x="307.2" y="130" width="50" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="332" y="148" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">drive</text>
<rect x="367.2" y="130" width="72" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="403" y="148" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">watchdog</text>
<rect x="30" y="186" width="880" height="90" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/>
<text x="48" y="212" font-size="15" font-weight="700" fill="#58a6ff">Runtime services</text>
<text x="48" y="230" font-size="11.5" fill="#8b949e">the middleware a robot needs</text>
<rect x="48" y="236" width="100" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="98" y="254" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">param server</text>
<rect x="158.4" y="236" width="64" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="191" y="254" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">TF tree</text>
<rect x="232.8" y="236" width="115" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="290" y="254" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">IPC blackboard</text>
<rect x="357.6" y="236" width="86" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="401" y="254" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">RPC (sewa)</text>
<rect x="453.6" y="236" width="122" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="515" y="254" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">record / replay</text>
<rect x="585.6" y="236" width="122" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="647" y="254" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">health / doctor</text>
<rect x="30" y="292" width="880" height="86" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.6"/>
<text x="48" y="318" font-size="15" font-weight="700" fill="#d29922">Kernel: init - supervisor - scheduler</text>
<text x="48" y="336" font-size="11.5" fill="#8b949e">boot from manifest, dependency order, restart policy, liveness watchdog</text>
<rect x="48" y="338" width="43" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="69" y="356" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">init</text>
<rect x="100.8" y="338" width="86" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="144" y="356" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">supervisor</text>
<rect x="196.8" y="338" width="194" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="294" y="356" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">restart on-failure/always</text>
<rect x="400.8" y="338" width="144" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="473" y="356" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">scheduler @rate_hz</text>
<rect x="30" y="394" width="880" height="86" rx="10" fill="#161b22" stroke="#f778ba" stroke-width="1.6"/>
<text x="48" y="420" font-size="15" font-weight="700" fill="#f778ba">HAL (hardware abstraction) + e-stop</text>
<text x="48" y="438" font-size="11.5" fill="#8b949e">devices behind one interface; band karo cuts actuators; fault injection</text>
<rect x="48" y="440" width="64" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="80" y="458" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">battery</text>
<rect x="122.4" y="440" width="57" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="151" y="458" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">wheels</text>
<rect x="189.60000000000002" y="440" width="36" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="207" y="458" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">imu</text>
<rect x="235.20000000000002" y="440" width="57" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="264" y="458" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">camera</text>
<rect x="302.40000000000003" y="440" width="64" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="335" y="458" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">gripper</text>
<rect x="376.80000000000007" y="440" width="57" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="405" y="458" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">E-STOP</text>
<rect x="444.00000000000006" y="440" width="108" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="498" y="458" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">MuJoCo bridge</text>
<rect x="30" y="496" width="880" height="86" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="1.6"/>
<text x="48" y="522" font-size="15" font-weight="700" fill="#8b949e">Robot Chalao native core (C++17)</text>
<text x="48" y="540" font-size="11.5" fill="#8b949e">the compiled language the whole OS is built on</text>
<rect x="48" y="542" width="50" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="73" y="560" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">lexer</text>
<rect x="108.0" y="542" width="57" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="137" y="560" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">parser</text>
<rect x="175.2" y="542" width="93" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="222" y="560" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">interpreter</text>
<rect x="278.4" y="542" width="144" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="350" y="560" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">callFunction (RPC)</text>
