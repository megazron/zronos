<svg xmlns="http://www.w3.org/2000/svg" width="920" height="600" viewBox="0 0 920 600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<rect width="920" height="600" fill="#0d1117"/>
<text x="30" y="40" font-size="22" font-weight="700" fill="#e6edf3">ChalaoOS architecture</text>
<text x="30" y="62" font-size="13" fill="#8b949e">A robot operating environment. Every service is a Robot Chalao (.rc) program.</text>
<rect x="30" y="84" width="860" height="86" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/>
<text x="48" y="110" font-size="15" font-weight="700" fill="#3fb950">Services (Robot Chalao .rc)</text>
<text x="48" y="128" font-size="11.5" fill="#8b949e">what the robot does -- one .rc per service, hot-loaded from the manifest</text>
<rect x="48" y="130" width="66" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="81" y="148" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">bringup</text>
<rect x="123.80000000000001" y="130" width="81" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="164" y="148" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">heartbeat</text>
<rect x="214.40000000000003" y="130" width="88" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="258" y="148" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">perception</text>
<rect x="312.40000000000003" y="130" width="51" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="338" y="148" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">drive</text>
<rect x="373.40000000000003" y="130" width="73" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="410" y="148" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">watchdog</text>
<rect x="30" y="186" width="860" height="86" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/>
<text x="48" y="212" font-size="15" font-weight="700" fill="#58a6ff">Shell + IPC blackboard</text>
<text x="48" y="230" font-size="11.5" fill="#8b949e">operate + talk between services</text>
<rect x="48" y="232" width="29" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="62" y="250" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">ps</text>
<rect x="86.8" y="232" width="88" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="131" y="250" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">start/stop</text>
<rect x="184.8" y="232" width="36" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="203" y="250" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">log</text>
<rect x="231.0" y="232" width="58" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="260" y="250" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">topics</text>
<rect x="299.4" y="232" width="44" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="321" y="250" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">echo</text>
<rect x="353.0" y="232" width="162" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="434" y="250" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">bolo -&gt; topic -&gt; sun</text>
<rect x="30" y="288" width="860" height="86" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.6"/>
<text x="48" y="314" font-size="15" font-weight="700" fill="#d29922">Kernel: init - supervisor - scheduler</text>
<text x="48" y="332" font-size="11.5" fill="#8b949e">boot from manifest, dependency order, restart policy, virtual-clock ticks</text>
<rect x="48" y="334" width="44" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="70" y="352" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">init</text>
<rect x="101.6" y="334" width="88" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="146" y="352" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">supervisor</text>
<rect x="199.6" y="334" width="199" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="299" y="352" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">restart on-failure/always</text>
<rect x="408.6" y="334" width="147" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="482" y="352" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">scheduler @rate_hz</text>
<rect x="30" y="390" width="860" height="86" rx="10" fill="#161b22" stroke="#f778ba" stroke-width="1.6"/>
<text x="48" y="416" font-size="15" font-weight="700" fill="#f778ba">HAL (hardware abstraction) + e-stop</text>
<text x="48" y="434" font-size="11.5" fill="#8b949e">devices behind one interface; band karo cuts actuators</text>
<rect x="48" y="436" width="66" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="81" y="454" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">battery</text>
<rect x="123.80000000000001" y="436" width="58" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="153" y="454" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">wheels</text>
<rect x="192.20000000000002" y="436" width="36" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="210" y="454" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">imu</text>
<rect x="238.40000000000003" y="436" width="58" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="268" y="454" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">camera</text>
<rect x="306.80000000000007" y="436" width="66" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="340" y="454" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">gripper</text>
<rect x="382.6000000000001" y="436" width="58" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="412" y="454" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">E-STOP</text>
<rect x="30" y="492" width="860" height="86" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="1.6"/>
<text x="48" y="518" font-size="15" font-weight="700" fill="#8b949e">Robot Chalao native core (C++17)</text>
<text x="48" y="536" font-size="11.5" fill="#8b949e">the compiled language the whole OS is built on</text>
<rect x="48" y="538" width="51" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="74" y="556" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">lexer</text>
<rect x="109.0" y="538" width="58" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="138" y="556" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">parser</text>
<rect x="177.4" y="538" width="95" height="26" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="225" y="556" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="monospace">interpreter</text>
<path d="M460.0 170 l0 14 m-5 -6 l5 6 l5 -6" stroke="#8b949e" stroke-width="1.4" fill="none"/>
<path d="M460.0 272 l0 14 m-5 -6 l5 6 l5 -6" stroke="#8b949e" stroke-width="1.4" fill="none"/>
<path d="M460.0 374 l0 14 m-5 -6 l5 6 l5 -6" stroke="#8b949e" stroke-width="1.4" fill="none"/>
